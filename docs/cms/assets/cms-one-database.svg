<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="540" viewBox="0 0 1250 540" role="img" aria-labelledby="cms-diagram-title cms-diagram-description">
  <title id="cms-diagram-title">One Notion database builds your whole website</title>
  <desc id="cms-diagram-description">One Notion CMS database contains rows for pages and sections, a shared header, navigation and footer, and gallery cards. Local Notion combines them into one website. Each row's Type chooses its role, Themes choose its appearance, Tags choose its behavior, and its address and status control location and publication. Edit in Notion, pull with Local Notion, then publish on your server. This is a teaching diagram, not a screenshot of a generated theme.</desc>
  <defs>
    <marker id="cms-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7890a9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1250" height="540" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17324d">
    <text x="32" y="40" font-size="30" font-weight="700">One database. Your whole website.</text>
    <text x="32" y="69" font-size="19" fill="#52677c">Keep the content and the shared parts of your site together in Notion.</text>

    <!-- The database is the single editable source. These are example rows. -->
    <rect x="32" y="102" width="350" height="252" rx="16" fill="#eef4fb" stroke="#b9cee6" stroke-width="1.5"/>
    <text x="52" y="136" font-size="24" font-weight="700" fill="#245fa7">One Notion CMS database</text>
    <text x="52" y="163" font-size="18" fill="#52677c">Rows for content and shared parts</text>
    <rect x="52" y="184" width="310" height="150" rx="9" fill="#ffffff" stroke="#d2dfe9"/>
    <path d="M 52 218 H 362 M 52 256 H 362 M 52 294 H 362" stroke="#dce5ed"/>
    <text x="68" y="207" font-size="17" font-weight="700" fill="#52677c">Type</text>
    <text x="192" y="207" font-size="17" font-weight="700" fill="#52677c">Item</text>
    <text x="68" y="244" font-size="20">Page</text>
    <text x="192" y="244" font-size="20">Home</text>
    <text x="68" y="282" font-size="20">Section</text>
    <text x="192" y="282" font-size="20">Welcome</text>
    <text x="68" y="320" font-size="20">Gallery</text>
    <text x="192" y="320" font-size="20">News</text>

    <!-- One database supplies all three kinds of website building parts. -->
    <g fill="none" stroke="#7890a9" stroke-width="2.2" stroke-linejoin="round">
      <path d="M 382 227 H 413 M 413 139 V 315"/>
      <path d="M 413 139 H 438 M 413 227 H 438 M 413 315 H 438" marker-end="url(#cms-arrow)"/>
      <path d="M 798 139 H 830 M 798 227 H 830 M 798 315 H 830 M 830 139 V 315"/>
      <path d="M 830 227 H 848" marker-end="url(#cms-arrow)"/>
    </g>
    <g stroke="#d1dce7" stroke-width="1.3">
      <rect x="448" y="102" width="350" height="74" rx="12" fill="#f6f8fa"/>
      <rect x="448" y="190" width="350" height="74" rx="12" fill="#f6f8fa"/>
      <rect x="448" y="278" width="350" height="74" rx="12" fill="#f6f8fa"/>
    </g>
    <text x="468" y="132" font-size="23" font-weight="700">Pages + sections</text>
    <text x="468" y="158" font-size="18" fill="#52677c">A page, or sections joined together</text>
    <text x="468" y="220" font-size="22" font-weight="700">Header + navigation + footer</text>
    <text x="468" y="246" font-size="18" fill="#52677c">Shared parts around your content</text>
    <text x="468" y="308" font-size="23" font-weight="700">Gallery cards</text>
    <text x="468" y="334" font-size="18" fill="#52677c">Cards with their own pages</text>

    <!-- A simple website illustration, not a particular rendered theme. -->
    <rect x="858" y="102" width="360" height="252" rx="13" fill="#ffffff" stroke="#b9cee6" stroke-width="1.5"/>
    <path d="M 871 102 H 1205 Q 1218 102 1218 115 V 139 H 858 V 115 Q 858 102 871 102" fill="#eef4fb"/>
    <circle cx="875" cy="120" r="3" fill="#9cb2c8"/>
    <circle cx="887" cy="120" r="3" fill="#9cb2c8"/>
    <circle cx="899" cy="120" r="3" fill="#9cb2c8"/>
    <text x="918" y="127" font-size="21" font-weight="700">Your whole website</text>
    <text x="875" y="165" font-size="17" fill="#52677c">Home</text>
    <text x="949" y="165" font-size="17" fill="#52677c">About</text>
    <text x="1023" y="165" font-size="17" fill="#52677c">News</text>
    <rect x="875" y="178" width="326" height="76" rx="8" fill="#2f73c6"/>
    <text x="891" y="210" font-size="25" font-weight="700" fill="#ffffff">Welcome</text>
    <text x="891" y="236" font-size="18" fill="#ffffff">Your words and images</text>
    <rect x="875" y="268" width="157" height="49" rx="7" fill="#eef4fb"/>
    <rect x="1044" y="268" width="157" height="49" rx="7" fill="#eef4fb"/>
    <text x="890" y="299" font-size="19">News</text>
    <text x="1058" y="299" font-size="19">More to read</text>
    <text x="875" y="342" font-size="17" fill="#52677c">Shared footer</text>

    <!-- Four familiar property groups, not a full schema reference. -->
    <g fill="#f5f7f9" stroke="#dce4ec">
      <rect x="32" y="377" width="286" height="70" rx="10"/>
      <rect x="332" y="377" width="286" height="70" rx="10"/>
      <rect x="632" y="377" width="286" height="70" rx="10"/>
      <rect x="932" y="377" width="286" height="70" rx="10"/>
    </g>
    <g font-size="22" font-weight="700" fill="#245fa7">
      <text x="48" y="405">Type</text>
      <text x="348" y="405">Themes</text>
      <text x="648" y="405">Tags</text>
      <text x="948" y="405">Address + status</text>
    </g>
    <g font-size="19" fill="#52677c">
      <text x="48" y="431">What a row becomes</text>
      <text x="348" y="431">How it looks</text>
      <text x="648" y="431">How it behaves</text>
      <text x="948" y="431">Location + publication</text>
    </g>

    <!-- Publishing is a separate, smaller flow beneath the content model. -->
    <g fill="#ffffff" stroke="#b9cee6" stroke-width="1.3">
      <rect x="126" y="486" width="300" height="38" rx="19"/>
      <rect x="476" y="486" width="300" height="38" rx="19"/>
      <rect x="826" y="486" width="300" height="38" rx="19"/>
    </g>
    <g fill="none" stroke="#7890a9" stroke-width="2" marker-end="url(#cms-arrow)">
      <path d="M 438 505 H 466"/>
      <path d="M 788 505 H 816"/>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="276" y="512">Edit in Notion</text>
      <text x="626" y="512">Pull with Local Notion</text>
      <text x="976" y="512">Publish on your server</text>
    </g>
  </g>
</svg>
